gui:
  mouseEvents: true
  showFileTree: true
  showCommandLog: true
  nerdFontsVersion: ""
  sidePanelWidth: 0.2
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --side-by-side
  autoFetch: true
  autoRefresh: true
confirmOnQuit: true
keybinding:
  universal:
    quit: "q"
