# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 10          # faster key repeat, nicer for vim inside tmux
set -g history-limit 10000
set -g mouse on
set -g base-index 1             # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Keybindings (prefix stays default: C-b)
# ---------------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows/panes open in the current pane's path
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation and resizing
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-interval 5
set -g status-style bg=black,fg=white
set -g status-left "#[bold]#S "
set -g status-right "%Y-%m-%d %H:%M"
setw -g window-status-current-style bold,fg=green
